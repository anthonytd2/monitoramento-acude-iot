<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel do Açude</title>
<script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{--bg:#0f1720;--card:#18232f;--tx:#e8eef4;--mut:#8aa0b4;--ok:#22c55e;--warn:#eab308;--bad:#ef4444;--cold:#3b82f6;--acc:#38bdf8}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:900px;margin:0 auto;padding:16px}
  h1{font-size:20px;margin:4px 0 2px}
  .sub{color:var(--mut);font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:14px}
  .card{background:var(--card);border-radius:14px;padding:16px}
  .lbl{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
  .big{font-size:48px;font-weight:700;margin-top:4px}
  .badge{display:inline-block;padding:6px 12px;border-radius:999px;font-weight:700;margin-top:8px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  button{border:0;border-radius:10px;padding:12px 14px;font-weight:700;font-size:15px;cursor:pointer;flex:1;min-width:120px}
  .b-auto{background:var(--acc);color:#04202e}.b-on{background:var(--ok);color:#052e12}.b-off{background:#475569;color:#fff}.b-lim{background:var(--warn);color:#2b2100}
  input{background:#0b121a;color:var(--tx);border:1px solid #2b3b4c;border-radius:10px;padding:12px;font-size:15px;flex:1;min-width:100px}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
  #log{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--mut);white-space:pre-wrap;max-height:140px;overflow:auto}
  .msg{font-size:13px;margin-top:8px;min-height:18px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🐟 Monitoramento do Açude</h1>
  <div class="sub"><span id="conDot" class="dot" style="background:#64748b"></span><span id="conTxt">Conectando ao broker...</span> · última leitura: <span id="ultima">—</span></div>

  <div class="grid">
    <div class="card"><div class="lbl">Temperatura da água</div><div class="big" id="temp">--.-°C</div><div id="estado" class="badge" style="background:#334155">AGUARDANDO</div></div>
    <div class="card"><div class="lbl">Aerador</div><div class="big" id="aer" style="font-size:36px">—</div><div class="sub" id="modo">Modo: —</div><div class="sub" id="lim">Limite: —</div></div>
  </div>

  <div class="card" style="margin-top:12px"><div class="lbl">Histórico (últimas leituras)</div><canvas id="graf" height="120"></canvas></div>

  <div class="card" style="margin-top:12px">
    <div class="lbl">Comandos</div>
    <div class="row">
      <input id="token" type="password" placeholder="Token de acesso (obrigatório para comandos)" autocomplete="off">
    </div>
    <div class="row">
      <button class="b-auto" onclick="enviar({modo:'auto'})">Modo automático</button>
      <button class="b-on" onclick="enviar({modo:'manual',aerador:true})">Manual: ligar aerador</button>
      <button class="b-off" onclick="enviar({modo:'manual',aerador:false})">Manual: desligar</button>
    </div>
    <div class="row">
      <input id="novoLim" type="number" step="0.5" placeholder="Novo limite (22 a 35 °C)">
      <button class="b-lim" onclick="enviarLimite()">Alterar limite</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card" style="margin-top:12px"><div class="lbl">Mensagens recebidas (JSON)</div><div id="log"></div></div>
</div>

<script>
const BASE = "acude/t02n";               // mesmo prefixo usado no ESP32
const TOP_DADOS = BASE + "/dados";
const TOP_CMD   = BASE + "/cmd";
const cores = {"NORMAL":"#22c55e","RESFRIANDO":"#eab308","ALERTA: AGUA QUENTE":"#ef4444","ALERTA: AGUA FRIA":"#3b82f6","FALHA NO SENSOR":"#a855f7"};

const graf = new Chart(document.getElementById("graf"), {
  type:"line",
  data:{labels:[],datasets:[{label:"°C",data:[],borderColor:"#38bdf8",backgroundColor:"rgba(56,189,248,.15)",fill:true,tension:.3,pointRadius:2}]},
  options:{plugins:{legend:{display:false}},scales:{x:{ticks:{color:"#8aa0b4",maxTicksLimit:6}},y:{ticks:{color:"#8aa0b4"},grid:{color:"#223040"}}}}
});

const id = "painel-" + Math.random().toString(16).slice(2,8);
const cli = mqtt.connect("wss://broker.hivemq.com:8884/mqtt", {clientId:id, reconnectPeriod:3000});

function status(ok, txt){ conDot.style.background = ok ? "#22c55e" : "#ef4444"; conTxt.textContent = txt; }
cli.on("connect", () => { status(true,"Conectado ao broker"); cli.subscribe(TOP_DADOS); });
cli.on("reconnect", () => status(false,"Reconectando..."));
cli.on("offline", () => status(false,"Sem conexão"));
cli.on("error", e => status(false,"Erro: " + e.message));

cli.on("message", (t, buf) => {
  let d; try { d = JSON.parse(buf.toString()); } catch { return; }   // ignora mensagens inválidas
  if (typeof d.temp !== "number") return;
  temp.textContent = d.temp.toFixed(1) + "°C";
  estado.textContent = d.estado || "—";
  estado.style.background = cores[d.estado] || "#334155";
  aer.textContent = d.aerador ? "LIGADO" : "DESLIGADO";
  aer.style.color = d.aerador ? "#22c55e" : "#94a3b8";
  modo.textContent = "Modo: " + (d.modo === "manual" ? "MANUAL" : "AUTOMÁTICO");
  lim.textContent = "Limite: " + d.limite + " °C";
  const h = new Date().toLocaleTimeString("pt-BR");
  ultima.textContent = h;
  graf.data.labels.push(h); graf.data.datasets[0].data.push(d.temp);
  if (graf.data.labels.length > 60) { graf.data.labels.shift(); graf.data.datasets[0].data.shift(); }
  graf.update();
  log.textContent = h + "  " + buf.toString() + "\n" + log.textContent.slice(0,3000);
});

function enviar(obj){
  if (!cli.connected) { msg.textContent = "⚠ Sem conexão com o broker"; return; }
  const tk = token.value.trim();
  if (!tk) { msg.textContent = "⚠ Digite o token de acesso antes de enviar comandos"; return; }
  cli.publish(TOP_CMD, JSON.stringify(Object.assign({token: tk}, obj)));
  msg.textContent = "✔ Comando enviado: " + JSON.stringify(obj) + " (com token)";
}
function enviarLimite(){
  const v = parseFloat(novoLim.value);
  if (isNaN(v) || v < 22 || v > 35) { msg.textContent = "⚠ Limite inválido: use um valor entre 22 e 35 °C"; return; }
  enviar({limite:v});
}
</script>
</body>
</html>
